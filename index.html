<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>SNAKE OS - CLEAN BLACK</title>
    <link rel="icon" href="https://img.icons8.com/emoji/48/snake-emoji.png">
    <style>
        /* --- הגדרות בסיס --- */
        body, html { margin: 0; padding: 0; height: 100%; background: #000; font-family: 'Segoe UI', sans-serif; overflow: hidden; color: #ddd; display: flex; flex-direction: column; }
        * { box-sizing: border-box; outline: none; }

        /* --- בר ניווט עליון (של המערכת) --- */
        .system-nav {
            background: #050505;
            border-bottom: 1px solid #222;
            height: 40px;
            display: flex; align-items: center; justify-content: space-between; padding: 0 10px; z-index: 500;
        }
        
        /* שעון */
        .clock { font-family: monospace; color: #0f0; font-size: 14px; text-shadow: 0 0 5px #0f0; }
        
        /* אזור הטאבים */
        .tabs-area { display: flex; align-items: flex-end; height: 100%; gap: 5px; flex-grow: 1; margin: 0 20px; }
        .tab { background: #111; color: #777; padding: 5px 15px; border-radius: 8px 8px 0 0; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 5px; height: 30px; border: 1px solid #222; border-bottom: none; margin-bottom: -1px; }
        .tab.active { background: #000; color: white; border-top: 1px solid #555; z-index: 10; height: 32px; }
        .close-x { font-size: 14px; margin-right: 5px; } .close-x:hover { color: red; }
        .add-btn { color: #555; font-size: 20px; cursor: pointer; } .add-btn:hover { color: white; }

        /* --- שורת הכתובת/חיפוש --- */
        .address-bar {
            height: 44px; background: #000; display: flex; align-items: center; padding: 0 15px; gap: 10px; border-bottom: 1px solid #222;
        }
        .nav-btn { background: none; border: none; color: #666; font-size: 18px; cursor: pointer; } .nav-btn:hover { color: white; }
        .url-box { flex-grow: 1; background: #111; border: 1px solid #333; color: #0f0; padding: 5px 15px; border-radius: 15px; font-family: monospace; direction: ltr; }

        /* --- תוכן --- */
        #content-area { flex-grow: 1; position: relative; overflow: hidden; background: #000; }
        .page-content { width: 100%; height: 100%; display: none; flex-direction: column; position: relative; }
        .page-content.active { display: flex; }

        /* --- מסך הבית (כשאין חיפוש) --- */
        .home-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #000; z-index: 10;
        }
        .hero-logo {
            width: 150px; height: 150px;
            background-image: url('https://img.icons8.com/ios-filled/150/ffffff/fingerprint.png'); /* לוגו */
            background-size: contain; background-repeat: no-repeat; opacity: 0.8;
            margin-bottom: 20px;
        }
        .hero-input {
            width: 500px; padding: 12px 20px; border-radius: 25px; background: #111; border: 1px solid #333;
            color: white; font-size: 16px; text-align: center;
        }

        /* --- האזור של האתר/גוגל --- */
        .iframe-container {
            flex-grow: 1; position: relative; overflow: hidden; display: none; background: #000;
        }

        /* 
           הטריק הגדול:
           1. מזיזים את האייפריים למעלה (top: -125px) כדי שהלוגו של גוגל ייצא מהמסך.
           2. מגדילים את הגובה (height: calc(100% + 125px)) כדי למלא את החסר למטה.
           3. פילטר צבעים להפוך לשחור.
        */
        .iframe-container iframe {
            position: absolute;
            left: 0;
            width: 100%;
            
            /* כאן קורה הקסם שמסתיר את הלוגו העליון של גוגל */
            top: -125px; 
            height: calc(100% + 125px); 
            
            border: none;
            background: white;
            /* הפילטר שהופך הכל לשחור */
            filter: invert(1) hue-rotate(180deg) grayscale(1) contrast(0.9);
        }

        /* --- הבר המזויף העליון (שלך) --- */
        /* הוא יושב בדיוק מעל החלק העליון של התוצאות, ומחליף את הבר של גוגל */
        .fake-header-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 60px;
            background: #000; z-index: 20; border-bottom: 1px solid #222;
            display: flex; align-items: center; padding: 0 20px; gap: 15px;
        }
        
        .small-logo {
            width: 40px; height: 40px;
            background-image: url('https://img.icons8.com/ios-filled/50/ffffff/fingerprint.png');
            background-size: cover; opacity: 0.7;
        }
        
        .fake-search-bar {
            flex-grow: 1; max-width: 600px; height: 38px;
            background: #111; border: 1px solid #333; border-radius: 20px;
            display: flex; align-items: center; padding: 0 15px;
        }
        .fake-input { background: transparent; border: none; color: #ddd; width: 100%; }

        /* --- הבר המזויף התחתון (מסתיר את הלוגו למטה) --- */
        .bottom-hider {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 40px;
            background: #000; z-index: 20; border-top: 1px solid #222;
        }

    </style>
</head>
<body>

    <!-- ניווט מערכת -->
    <div class="system-nav">
        <div style="font-weight:bold; opacity:0.5; font-size:12px;">SNAKE OS</div>
        <div class="tabs-area" id="tabs-list"></div>
        <div class="add-btn" onclick="openNewTab()">+</div>
        <div class="clock" id="clock">00:00</div>
    </div>

    <!-- שורת כתובת -->
    <div class="address-bar">
        <button class="nav-btn" onclick="goBack()">➜</button>
        <button class="nav-btn" style="transform: scaleX(-1);" onclick="goForward()">➜</button>
        <button class="nav-btn" onclick="doRefresh()">↻</button>
        <input type="text" class="url-box" id="url-bar" placeholder="Enter URL or Search..." onkeypress="if(event.key==='Enter') performSearch(this.value)">
    </div>

    <!-- תוכן ראשי -->
    <div id="content-area"></div>

    <script>
        // שעון
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'});
        }, 1000);

        let tabCounter = 0;
        let activeTabId = null;
        let historyStack = {}; 
        let historyIndex = {};

        function openNewTab() {
            tabCounter++;
            const tabId = 'tab-' + tabCounter;
            const contentId = 'content-' + tabCounter;
            
            historyStack[tabId] = ['home'];
            historyIndex[tabId] = 0;

            // יצירת טאב
            const newTab = document.createElement('div');
            newTab.className = 'tab';
            newTab.id = tabId;
            newTab.onclick = () => switchToTab(tabId);
            newTab.innerHTML = `<span class="close-x" onclick="closeTab(event, '${tabId}')">×</span> <span>New Tab</span>`;
            document.getElementById('tabs-list').appendChild(newTab);

            // יצירת תוכן
            const newContent = document.createElement('div');
            newContent.className = 'page-content';
            newContent.id = contentId;
            newContent.innerHTML = `
                <!-- מסך בית -->
                <div class="home-screen">
                    <div class="hero-logo"></div>
                    <h2 style="font-weight:300; margin-bottom:20px;">SECURE SEARCH</h2>
                    <input class="hero-input" placeholder="Search..." onkeypress="if(event.key==='Enter') performSearch(this.value)">
                </div>

                <!-- אתר / גוגל -->
                <div class="iframe-container">
                    
                    <!-- הבר השחור העליון שלך -->
                    <div class="fake-header-overlay" id="overlay-header-${contentId}">
                        <div class="small-logo"></div>
                        <div class="fake-search-bar">
                            <input class="fake-input" onkeypress="if(event.key==='Enter') performSearch(this.value)">
                        </div>
                    </div>

                    <!-- הבר השחור התחתון -->
                    <div class="bottom-hider" id="overlay-footer-${contentId}"></div>

                    <iframe src="about:blank" sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-modals allow-pointer-lock"></iframe>
                </div>
            `;
            document.getElementById('content-area').appendChild(newContent);
            switchToTab(tabId);
        }

        function performSearch(query) {
            if(!activeTabId || !query) return;
            const currentStack = historyStack[activeTabId];
            const currentIndex = historyIndex[activeTabId];
            if (currentIndex < currentStack.length - 1) {
                historyStack[activeTabId] = currentStack.slice(0, currentIndex + 1);
            }
            historyStack[activeTabId].push(query);
            historyIndex[activeTabId]++;
            loadContent(activeTabId, query);
        }

        function loadContent(tabId, query) {
            const contentId = tabId.replace('tab-', 'content-');
            const contentDiv = document.getElementById(contentId);
            const home = contentDiv.querySelector('.home-screen');
            const container = contentDiv.querySelector('.iframe-container');
            const iframe = container.querySelector('iframe');
            const fakeInput = container.querySelector('.fake-input');
            const headerOverlay = document.getElementById(`overlay-header-${contentId}`);
            const footerOverlay = document.getElementById(`overlay-footer-${contentId}`);

            if (query === 'home') {
                home.style.display = 'flex';
                container.style.display = 'none';
                document.getElementById('url-bar').value = '';
                document.querySelector(`#${tabId} span:last-child`).innerText = 'דף הבית';
                return;
            }

            home.style.display = 'none';
            container.style.display = 'block';

            let url = "";
            if (query.indexOf('.') > -1 && query.indexOf(' ') === -1) {
                // כתובת רגילה - מציגים רגיל
                url = query.startsWith('http') ? query : 'https://' + query;
                // מבטלים את ההסתרות והפילטרים כי זה לא גוגל
                headerOverlay.style.display = 'none';
                footerOverlay.style.display = 'none';
                iframe.style.top = '0';
                iframe.style.height = '100%';
                iframe.style.filter = 'none';
            } else {
                // חיפוש גוגל - מפעילים את המצב השחור וההסתרות
                url = "https://www.google.com/search?igu=1&q=" + encodeURIComponent(query);
                
                headerOverlay.style.display = 'flex';
                footerOverlay.style.display = 'block';
                
                // החזרת ההזזה (כדי להעלים את הלוגו של גוגל למעלה)
                iframe.style.top = '-125px';
                iframe.style.height = 'calc(100% + 125px)';
                
                // החזרת הצבע השחור
                iframe.style.filter = 'invert(1) hue-rotate(180deg) grayscale(1) contrast(0.9)';
            }

            if(iframe.src !== url) iframe.src = url;

            const tabTitle = document.querySelector(`#${tabId} span:last-child`);
            tabTitle.innerText = query.length > 15 ? query.substring(0, 15) + '...' : query;
            if(activeTabId === tabId) document.getElementById('url-bar').value = query;
            if(fakeInput) fakeInput.value = query;
        }

        function goBack() {
            if (!activeTabId) return;
            if (historyIndex[activeTabId] > 0) {
                historyIndex[activeTabId]--;
                loadContent(activeTabId, historyStack[activeTabId][historyIndex[activeTabId]]);
            }
        }
        function goForward() {
            if (!activeTabId) return;
            if (historyIndex[activeTabId] < historyStack[activeTabId].length - 1) {
                historyIndex[activeTabId]++;
                loadContent(activeTabId, historyStack[activeTabId][historyIndex[activeTabId]]);
            }
        }
        function switchToTab(tabId) {
            activeTabId = tabId;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.page-content').forEach(c => c.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.getElementById(tabId.replace('tab-', 'content-')).classList.add('active');
            
            const currentQuery = historyStack[tabId][historyIndex[tabId]];
            document.getElementById('url-bar').value = (currentQuery === 'home') ? '' : currentQuery;
        }
        function closeTab(e, tabId) {
            e.stopPropagation();
            if (document.querySelectorAll('.tab').length === 1) { alert("Last tab!"); return; }
            const tab = document.getElementById(tabId);
            if (tab.classList.contains('active')) {
                const sibling = tab.previousElementSibling || tab.nextElementSibling;
                if(sibling) sibling.click();
            }
            tab.remove();
            document.getElementById(tabId.replace('tab-', 'content-')).remove();
        }
        function doRefresh() {
            if(activeTabId) {
                const iframe = document.getElementById(activeTabId.replace('tab-', 'content-')).querySelector('iframe');
                if (iframe.style.display !== 'none') iframe.src = iframe.src;
            }
        }

        openNewTab();
    </script>
</body>
</html>
