<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>SNAKE OS - PURE BLACK</title>
    <link rel="icon" href="https://img.icons8.com/emoji/48/snake-emoji.png">
    <style>
        /* --- הגדרות כלליות --- */
        body, html { margin: 0; padding: 0; height: 100%; background: #000; font-family: 'Segoe UI', sans-serif; overflow: hidden; color: #e0e0e0; display: flex; flex-direction: column; }
        * { box-sizing: border-box; outline: none; }

        /* --- הבר העליון (דק ונקי) --- */
        .admin-header {
            background: #000;
            border-bottom: 1px solid #111;
            height: 40px;
            display: flex; align-items: center; padding: 0 15px; justify-content: space-between; z-index: 200;
        }
        .brand { color: #fff; font-weight: bold; font-size: 14px; opacity: 0.5; }
        
        /* שעון */
        .clock-display {
            font-family: monospace; font-size: 14px; color: #0f0; 
            position: absolute; left: 50%; transform: translateX(-50%);
        }

        /* --- ניווט --- */
        .nav-container { background: #050505; border-bottom: 1px solid #111; display: flex; flex-direction: column; padding-top: 5px; }
        .tabs-row { display: flex; align-items: flex-end; padding: 0 10px; gap: 5px; height: 30px; }
        .tab { background: #111; color: #666; padding: 2px 15px; border-radius: 8px 8px 0 0; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; max-width: 150px; border: 1px solid #222; border-bottom: none; }
        .tab.active { background: #000; color: #fff; height: 31px; border-top: 1px solid #333; border-bottom: 1px solid #000; z-index: 10; }
        .close-tab { font-size: 14px; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; }
        .close-tab:hover { color: #f00; }
        .add-tab-btn { color: #444; font-size: 20px; cursor: pointer; padding: 0 10px; }

        .address-bar-row { padding: 5px 15px; display: flex; gap: 10px; align-items: center; background: #000; border-bottom: 1px solid #111; height: 50px; }
        .nav-btn { background: #000; border: 1px solid #222; color: #888; cursor: pointer; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .nav-btn:hover { background: #111; color: #fff; }
        .url-input { flex-grow: 1; background: #0a0a0a; border: 1px solid #222; color: #ddd; padding: 6px 15px; border-radius: 20px; font-size: 13px; direction: ltr; text-align: left; font-family: monospace; }

        /* --- תוכן --- */
        #content-area { flex-grow: 1; position: relative; overflow: hidden; background: #000; }
        .page-content { width: 100%; height: 100%; display: none; flex-direction: column; position: relative; }
        .page-content.active { display: flex; }

        /* מסך הבית */
        .home-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; background: #000; z-index: 5; }
        .logo-container { width: 120px; height: 120px; margin-bottom: 20px; position: relative; }
        .my-custom-bg-logo {
            width: 100%; height: 100%;
            background-image: url('https://img.icons8.com/ios-filled/150/ffffff/fingerprint.png'); /* שים פה את הלוגו שלך */
            background-size: contain; background-repeat: no-repeat; background-position: center;
            opacity: 0.8;
        }

        /* --- אזור האייפריים --- */
        .iframe-wrapper {
            flex-grow: 1; position: relative; overflow: hidden; background: #000; display: none;
        }

        /* אייפריים - הופכים צבעים לשחור */
        .iframe-wrapper iframe {
            width: 100%;
            height: 100%; /* גובה מלא, בלי חיתוך */
            border: none;
            background: #fff;
            /* הפילטר הזה הופך את גוגל לשחור */
            filter: invert(1) hue-rotate(180deg) grayscale(1);
        }

        /* --- הכיסויים השחורים ("הצביעה") --- */
        
        /* 1. הבר השחור העליון - מסתיר את הלוגו של גוגל למעלה */
        .paint-it-black-header {
            position: absolute;
            top: 0; left: 0; width: 100%;
            height: 120px; /* הגובה שמכסה את הלוגו של גוגל */
            background: #000;
            z-index: 20;
            border-bottom: 1px solid #111;
            display: flex; align-items: center; justify-content: center;
        }

        /* 2. הבר השחור התחתון - מסתיר את הלוגו של גוגל למטה */
        .paint-it-black-footer {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            height: 50px; /* הגובה שמכסה את הלוגו למטה */
            background: #000;
            z-index: 20;
            border-top: 1px solid #111;
        }

        /* האלמנטים שיושבים על הבר השחור העליון */
        .my-overlay-controls {
            width: 80%; max-width: 700px;
            display: flex; align-items: center; gap: 15px;
        }
        .corner-logo {
            width: 50px; height: 50px;
            background-image: url('https://img.icons8.com/ios-filled/50/ffffff/fingerprint.png'); /* לוגו שלך */
            background-size: cover; opacity: 0.7;
        }
        .fake-search-wrapper {
            flex-grow: 1; height: 44px;
            background: #111; border: 1px solid #333; border-radius: 22px;
            display: flex; align-items: center; padding: 0 15px;
        }
        .fake-input { flex-grow: 1; background: transparent; border: none; color: white; font-size: 14px; }

        /* לוגו מים ענק באמצע המסך שקוף */
        .watermark-bg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            width: 400px; height: 400px;
            background-image: url('https://img.icons8.com/ios-filled/400/ffffff/fingerprint.png');
            background-size: contain; background-repeat: no-repeat;
            opacity: 0.03; pointer-events: none; z-index: 10;
        }

    </style>
</head>
<body>

    <div class="admin-header">
        <div class="brand">SNAKE OS</div>
        <div class="clock-display" id="real-time-clock">00:00:00</div>
        <div></div>
    </div>

    <div class="nav-container">
        <div class="tabs-row">
            <div id="tabs-list" style="display:flex; gap:5px; align-items:flex-end;"></div>
            <div class="add-tab-btn" onclick="openNewTab()">+</div>
        </div>
        <div class="address-bar-row">
            <button class="nav-btn" onclick="goBack()">➜</button>
            <button class="nav-btn" style="transform: scaleX(-1);" onclick="goForward()">➜</button>
            <button class="nav-btn" onclick="doRefresh()">↻</button>
            <input type="text" class="url-input" id="url-bar" placeholder="חיפוש..." onkeypress="if(event.key==='Enter') performSearch(this.value)">
        </div>
    </div>

    <div id="content-area"></div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('real-time-clock').innerText = now.toLocaleTimeString('he-IL');
        }
        setInterval(updateClock, 1000);
        updateClock();

        let tabCounter = 0;
        let activeTabId = null;
        let historyStack = {}; 
        let historyIndex = {};

        function openNewTab() {
            tabCounter++;
            const tabId = 'tab-' + tabCounter;
            const contentId = 'content-' + tabCounter;
            
            historyStack[tabId] = ['home'];
            historyIndex[tabId] = 0;

            const tabsList = document.getElementById('tabs-list');
            const newTab = document.createElement('div');
            newTab.className = 'tab';
            newTab.id = tabId;
            newTab.onclick = () => switchToTab(tabId);
            newTab.innerHTML = `<span>New Tab</span> <span class="close-tab" onclick="closeTab(event, '${tabId}')">×</span>`;
            tabsList.appendChild(newTab);

            const contentArea = document.getElementById('content-area');
            const newContent = document.createElement('div');
            newContent.className = 'page-content';
            newContent.id = contentId;
            
            newContent.innerHTML = `
                <div class="home-screen">
                    <div class="logo-container">
                        <div class="my-custom-bg-logo"></div>
                    </div>
                    <h1 style="color:#fff; font-weight:300; margin:0;">SECURE SEARCH</h1>
                    <div style="margin-top:20px; width:500px; height:44px; background:#111; border-radius:22px; border:1px solid #333; display:flex; align-items:center; padding:0 15px;">
                        <input type="text" style="width:100%; background:transparent; border:none; color:white;" placeholder="Search..." onkeypress="if(event.key==='Enter') performSearch(this.value)">
                    </div>
                </div>
                
                <div class="iframe-wrapper">
                    <div class="watermark-bg"></div>

                    <!-- הכיסוי השחור העליון (מסתיר את גוגל למעלה) -->
                    <div class="paint-it-black-header">
                        <div class="my-overlay-controls">
                            <div class="corner-logo"></div>
                            <div class="fake-search-wrapper">
                                <span style="color:#666; margin-left:10px;">🔍</span>
                                <input type="text" class="fake-input" onkeypress="if(event.key==='Enter') performSearch(this.value)">
                            </div>
                        </div>
                    </div>

                    <!-- הכיסוי השחור התחתון (מסתיר את גוגל למטה) -->
                    <div class="paint-it-black-footer"></div>
                    
                    <iframe src="about:blank" sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-modals allow-pointer-lock"></iframe>
                </div>
            `;
            contentArea.appendChild(newContent);
            switchToTab(tabId);
        }

        function performSearch(query) {
            if(!activeTabId || !query) return;
            const currentStack = historyStack[activeTabId];
            const currentIndex = historyIndex[activeTabId];
            if (currentIndex < currentStack.length - 1) {
                historyStack[activeTabId] = currentStack.slice(0, currentIndex + 1);
            }
            historyStack[activeTabId].push(query);
            historyIndex[activeTabId]++;
            loadContent(activeTabId, query);
        }

        function loadContent(tabId, query) {
            const contentId = tabId.replace('tab-', 'content-');
            const contentDiv = document.getElementById(contentId);
            const home = contentDiv.querySelector('.home-screen');
            const wrapper = contentDiv.querySelector('.iframe-wrapper');
            const iframe = wrapper.querySelector('iframe');
            const fakeInput = wrapper.querySelector('.fake-input');
            const headerCover = wrapper.querySelector('.paint-it-black-header');
            const footerCover = wrapper.querySelector('.paint-it-black-footer');

            if (query === 'home') {
                home.style.display = 'flex';
                wrapper.style.display = 'none';
                document.getElementById('url-bar').value = '';
                document.querySelector(`#${tabId} span`).innerText = 'דף הבית';
                return;
            }

            home.style.display = 'none';
            wrapper.style.display = 'block';

            let url = "";
            if (query.indexOf('.') > -1 && query.indexOf(' ') === -1) {
                // גלישה לאתר רגיל (לא גוגל)
                url = query.startsWith('http') ? query : 'https://' + query;
                // באתרים רגילים - נבטל את הפסים השחורים כי לא צריך להסתיר את גוגל
                headerCover.style.display = 'none';
                footerCover.style.display = 'none';
                // נבטל גם את הפיכת הצבעים כדי שיראו את האתר רגיל
                iframe.style.filter = 'none';
            } else {
                // חיפוש בגוגל
                url = "https://www.google.com/search?igu=1&q=" + encodeURIComponent(query);
                // נחזיר את הפסים השחורים שמסתירים את הלוגו
                headerCover.style.display = 'flex';
                footerCover.style.display = 'block';
                // נחזיר את הפיכת הצבעים לשחור
                iframe.style.filter = 'invert(1) hue-rotate(180deg) grayscale(1)';
            }

            if(iframe.src !== url) iframe.src = url;

            const tabTitle = document.querySelector(`#${tabId} span`);
            tabTitle.innerText = query.length > 15 ? query.substring(0, 15) + '...' : query;
            if(activeTabId === tabId) document.getElementById('url-bar').value = query;
            if(fakeInput) fakeInput.value = query;
        }

        function goBack() {
            if (!activeTabId) return;
            if (historyIndex[activeTabId] > 0) {
                historyIndex[activeTabId]--;
                const query = historyStack[activeTabId][historyIndex[activeTabId]];
                loadContent(activeTabId, query);
            }
        }

        function goForward() {
            if (!activeTabId) return;
            if (historyIndex[activeTabId] < historyStack[activeTabId].length - 1) {
                historyIndex[activeTabId]++;
                const query = historyStack[activeTabId][historyIndex[activeTabId]];
                loadContent(activeTabId, query);
            }
        }

        function switchToTab(tabId) {
            activeTabId = tabId;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.page-content').forEach(c => c.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            const contentId = tabId.replace('tab-', 'content-');
            document.getElementById(contentId).classList.add('active');
            const currentIndex = historyIndex[tabId];
            const currentQuery = historyStack[tabId][currentIndex];
            document.getElementById('url-bar').value = (currentQuery === 'home') ? '' : currentQuery;
        }

        function closeTab(e, tabId) {
            e.stopPropagation();
            if (document.querySelectorAll('.tab').length === 1) { alert("Cannot close last tab"); return; }
            const tab = document.getElementById(tabId);
            if (tab.classList.contains('active')) {
                const sibling = tab.previousElementSibling || tab.nextElementSibling;
                if(sibling && sibling.id !== 'tabs-list') sibling.click();
                else document.querySelector('.tab:not(#'+tabId+')').click();
            }
            tab.remove();
            document.getElementById(tabId.replace('tab-', 'content-')).remove();
            delete historyStack[tabId];
            delete historyIndex[tabId];
        }

        function doRefresh() {
            if(activeTabId) {
                const iframe = document.getElementById(activeTabId.replace('tab-', 'content-')).querySelector('iframe');
                if (iframe.style.display !== 'none') iframe.src = iframe.src;
            }
        }

        openNewTab();
    </script>
</body>
</html>
