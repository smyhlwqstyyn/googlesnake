<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNAKE OS v12 - ULTRA</title>
    <link rel="icon" id="dynamic-favicon" href="https://img.icons8.com/emoji/48/snake-emoji.png">
    <style>
        /* --- משתנים ועיצוב גלובלי --- */
        :root {
            --primary: #00ff88;
            --secondary: #00cc6a;
            --bg-dark: #0a0a0a;
            --glass: rgba(20, 20, 20, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text: #e0e0e0;
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * { box-sizing: border-box; outline: none; user-select: none; }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: var(--font-main); background: var(--bg-dark); color: var(--text); }
        
        /* רקע אנימטיבי */
        .bg-animation {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000 100%);
        }
        .grid-overlay {
            position: absolute; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* --- הבר העליון (Taskbar) --- */
        .os-header {
            height: 48px; background: rgba(10, 10, 10, 0.9); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
            backdrop-filter: blur(10px); z-index: 1000;
        }
        .logo { font-weight: 800; font-size: 18px; color: var(--primary); letter-spacing: 1px; display: flex; align-items: center; gap: 10px; text-shadow: 0 0 10px rgba(0,255,136,0.3); }
        .clock { font-family: monospace; font-size: 14px; color: #aaa; }
        
        .controls { display: flex; gap: 15px; }
        .btn-icon { cursor: pointer; transition: 0.3s; font-size: 18px; color: #fff; padding: 5px; border-radius: 5px; position: relative; }
        .btn-icon:hover { background: rgba(255,255,255,0.1); color: var(--primary); transform: scale(1.1); }
        
        /* --- כפתור חירום --- */
        .panic-btn { border: 1px solid #ff4444; color: #ff4444; }
        .panic-btn:hover { background: #ff4444; color: white; box-shadow: 0 0 15px #ff4444; }

        /* --- אזור העבודה המרכזי --- */
        .main-container { display: flex; height: calc(100% - 48px); }
        
        /* סרגל צד (Launcher) */
        .sidebar {
            width: 70px; background: rgba(0,0,0,0.5); border-left: 1px solid var(--border);
            display: flex; flex-direction: column; align-items: center; padding-top: 20px; gap: 20px;
            backdrop-filter: blur(5px); z-index: 900;
        }
        .app-icon {
            width: 45px; height: 45px; border-radius: 12px; background: #222; cursor: pointer;
            display: flex; justify-content: center; align-items: center; font-size: 22px;
            transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: 1px solid transparent;
        }
        .app-icon:hover, .app-icon.active { background: #333; border-color: var(--primary); transform: translateX(-5px); box-shadow: 5px 5px 15px rgba(0,0,0,0.5); }
        .tooltip { position: absolute; right: 75px; background: #000; padding: 5px 10px; border-radius: 5px; font-size: 12px; opacity: 0; pointer-events: none; transition: 0.2s; border: 1px solid #444; }
        .app-icon:hover .tooltip { opacity: 1; right: 80px; }

        /* אזור התוכן (חלונות) */
        .content-area { flex-grow: 1; position: relative; overflow: hidden; background: rgba(0,0,0,0.2); }
        
        /* --- מסך האפליקציות (חלונות) --- */
        .app-window {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; opacity: 0; transition: opacity 0.3s;
        }
        .app-window.active { display: flex; opacity: 1; }

        /* --- אפליקציית דפדפן (Browser) --- */
        .browser-bar {
            padding: 10px 20px; background: #1a1a1a; display: flex; gap: 10px; align-items: center;
            border-bottom: 1px solid #333;
        }
        .url-input {
            flex-grow: 1; background: #000; border: 1px solid #333; color: var(--primary);
            padding: 8px 15px; border-radius: 20px; font-family: monospace; direction: ltr;
        }
        .action-btn { background: #333; border: none; color: white; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; }
        .action-btn:hover { background: var(--primary); color: black; }
        
        iframe { flex-grow: 1; border: none; background: white; }

        /* --- אפליקציית סנייק (Game) --- */
        .game-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%;
            background: rgba(0,0,0,0.8);
        }
        canvas { border: 2px solid var(--primary); box-shadow: 0 0 30px rgba(0, 255, 136, 0.2); background: #000; }
        .score-board { font-size: 24px; margin-bottom: 20px; font-family: monospace; color: var(--primary); }
        .start-btn { 
            margin-top: 20px; padding: 10px 30px; background: var(--primary); border: none; 
            font-weight: bold; cursor: pointer; font-size: 18px; border-radius: 5px;
            box-shadow: 0 0 15px var(--primary); transition: 0.3s;
        }
        .start-btn:hover { background: white; box-shadow: 0 0 25px white; }

        /* --- אפליקציית בית (Dashboard) --- */
        .dashboard { padding: 40px; text-align: center; overflow-y: auto; }
        .hero-title { font-size: 60px; font-weight: 900; background: linear-gradient(to right, #fff, #888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
        .search-hero {
            width: 600px; max-width: 100%; padding: 15px 25px; border-radius: 50px; border: 2px solid #333;
            background: rgba(0,0,0,0.5); color: white; font-size: 18px; outline: none; transition: 0.3s;
            margin: 20px auto; display: block; text-align: center;
        }
        .search-hero:focus { border-color: var(--primary); box-shadow: 0 0 20px rgba(0, 255, 136, 0.2); }
        
        .shortcuts-grid { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 40px; }
        .shortcut-card {
            width: 120px; height: 120px; background: rgba(255,255,255,0.05); border-radius: 15px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
            cursor: pointer; transition: 0.3s; border: 1px solid transparent;
        }
        .shortcut-card:hover { background: rgba(255,255,255,0.1); border-color: var(--primary); transform: translateY(-5px); }
        .shortcut-icon { font-size: 35px; }
        .shortcut-name { font-size: 14px; color: #ccc; }

    </style>
</head>
<body>

    <div class="bg-animation"><div class="grid-overlay"></div></div>

    <!-- בר עליון -->
    <div class="os-header">
        <div class="logo"><span>🐍</span> SNAKE OS <span style="font-size:10px; background:var(--primary); color:black; padding:2px 5px; border-radius:4px;">PRO</span></div>
        <div class="clock" id="clock">00:00</div>
        <div class="controls">
            <div class="btn-icon panic-btn" onclick="activatePanicMode()" title="מצב חירום (~) - הופך לגוגל קלאסרום">👁️</div>
            <div class="btn-icon" onclick="document.body.requestFullscreen()">⛶</div>
        </div>
    </div>

    <div class="main-container">
        <!-- תוכן ראשי -->
        <div class="content-area">
            
            <!-- אפליקציה 1: דף הבית -->
            <div id="app-home" class="app-window active">
                <div class="dashboard">
                    <div style="font-size: 80px;">🐍</div>
                    <div class="hero-title">SNAKE OS</div>
                    <p style="color:#888;">מערכת המשחקים המתקדמת ביותר</p>
                    
                    <input type="text" class="search-hero" id="main-search" placeholder="חפש בגוגל או הקלד כתובת..." onkeypress="if(event.key==='Enter') searchWeb(this.value)">
                    
                    <div class="shortcuts-grid">
                        <div class="shortcut-card" onclick="openApp('app-game')">
                            <div class="shortcut-icon">🎮</div>
                            <div class="shortcut-name">SNAKE GAME</div>
                        </div>
                        <div class="shortcut-card" onclick="searchWeb('https://discord.com/app')">
                            <div class="shortcut-icon">💬</div>
                            <div class="shortcut-name">Discord</div>
                        </div>
                        <div class="shortcut-card" onclick="searchWeb('https://poki.com')">
                            <div class="shortcut-icon">🕹️</div>
                            <div class="shortcut-name">Poki Games</div>
                        </div>
                        <div class="shortcut-card" onclick="searchWeb('https://open.spotify.com')">
                            <div class="shortcut-icon">🎵</div>
                            <div class="shortcut-name">Spotify</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- אפליקציה 2: דפדפן -->
            <div id="app-browser" class="app-window">
                <div class="browser-bar">
                    <button class="action-btn" onclick="document.querySelector('iframe').src = document.querySelector('iframe').src">↻</button>
                    <input type="text" class="url-input" id="browser-url" placeholder="https://..." onkeypress="if(event.key==='Enter') loadIframe(this.value)">
                    <button class="action-btn" onclick="loadIframe(document.getElementById('browser-url').value)">➜</button>
                </div>
                <iframe id="web-frame" src="about:blank" sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-pointer-lock allow-presentation"></iframe>
            </div>

            <!-- אפליקציה 3: משחק סנייק -->
            <div id="app-game" class="app-window">
                <div class="game-container">
                    <div class="score-board">SCORE: <span id="score">0</span></div>
                    <canvas id="snakeCanvas" width="600" height="400"></canvas>
                    <button class="start-btn" onclick="startGame()">התחל משחק</button>
                    <p style="color:#666; margin-top:10px;">השתמש בחיצים כדי לזוז</p>
                </div>
            </div>

        </div>

        <!-- תפריט צד -->
        <div class="sidebar">
            <div class="app-icon active" onclick="openApp('app-home')" id="nav-home">
                🏠 <span class="tooltip">בית</span>
            </div>
            <div class="app-icon" onclick="openApp('app-browser')" id="nav-browser">
                🌐 <span class="tooltip">דפדפן</span>
            </div>
            <div class="app-icon" onclick="openApp('app-game')" id="nav-game">
                🐍 <span class="tooltip">סנייק</span>
            </div>
            <div style="flex-grow:1"></div>
            <div class="app-icon" onclick="alert('הגדרות בקרוב...')" style="margin-bottom:20px; color:#666;">
                ⚙️
            </div>
        </div>
    </div>

    <script>
        // --- ניהול זמן ---
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('he-IL', {hour: '2-digit', minute:'2-digit'});
        }, 1000);

        // --- ניהול אפליקציות ---
        function openApp(appId) {
            // הסתרת כל החלונות
            document.querySelectorAll('.app-window').forEach(w => w.classList.remove('active'));
            document.querySelectorAll('.app-icon').forEach(i => i.classList.remove('active'));
            
            // הצגת החלון הרצוי
            document.getElementById(appId).classList.add('active');
            
            // סימון האייקון המתאים
            const iconId = 'nav-' + appId.split('-')[1];
            const icon = document.getElementById(iconId);
            if(icon) icon.classList.add('active');

            // עצירת המשחק אם יצאנו ממנו
            if (appId !== 'app-game') stopGame();
        }

        // --- דפדפן ---
        function searchWeb(query) {
            openApp('app-browser');
            let url = query;
            if (!url.includes('.') || url.includes(' ')) {
                url = 'https://www.google.com/search?igu=1&q=' + encodeURIComponent(query);
            } else {
                if (!url.startsWith('http')) url = 'https://' + url;
            }
            loadIframe(url);
        }

        function loadIframe(url) {
            const iframe = document.getElementById('web-frame');
            const input = document.getElementById('browser-url');
            input.value = url;
            iframe.src = url;
        }

        // --- מצב חירום (Panic Mode) ---
        let isPanic = false;
        const originalTitle = document.title;
        const originalIcon = document.getElementById('dynamic-favicon').href;

        function activatePanicMode() {
            isPanic = !isPanic;
            if(isPanic) {
                document.title = "Google Classroom";
                document.getElementById('dynamic-favicon').href = "https://upload.wikimedia.org/wikipedia/commons/5/59/Google_Classroom_Logo.png";
                
                // יצירת מסך מזויף מעל הכל
                const panicScreen = document.createElement('div');
                panicScreen.id = 'panic-overlay';
                panicScreen.style.position = 'fixed';
                panicScreen.style.top = '0';
                panicScreen.style.left = '0';
                panicScreen.style.width = '100%';
                panicScreen.style.height = '100%';
                panicScreen.style.background = 'white';
                panicScreen.style.zIndex = '99999';
                panicScreen.innerHTML = '<iframe src="https://wikipedia.org" style="width:100%; height:100%; border:none;"></iframe>';
                document.body.appendChild(panicScreen);
            } else {
                document.title = originalTitle;
                document.getElementById('dynamic-favicon').href = originalIcon;
                const overlay = document.getElementById('panic-overlay');
                if(overlay) overlay.remove();
            }
        }

        // מקש קיצור לחירום (טילדה ~)
        document.addEventListener('keydown', (e) => {
            if (e.key === '`' || e.key === '~') {
                activatePanicMode();
            }
        });

        // --- משחק סנייק (בתוך הקוד!) ---
        const canvas = document.getElementById('snakeCanvas');
        const ctx = canvas.getContext('2d');
        const box = 20;
        let snake = [];
        let food = {};
        let d;
        let gameInterval;
        let score = 0;

        function startGame() {
            if(gameInterval) clearInterval(gameInterval);
            snake = [];
            snake[0] = { x: 9 * box, y: 10 * box };
            score = 0;
            document.getElementById('score').innerText = score;
            d = null; // מתחילים בלי תזוזה עד לחיצה
            generateFood();
            gameInterval = setInterval(drawGame, 100);
            canvas.focus();
        }

        function stopGame() {
            clearInterval(gameInterval);
        }

        function generateFood() {
            food = {
                x: Math.floor(Math.random() * (canvas.width/box)) * box,
                y: Math.floor(Math.random() * (canvas.height/box)) * box
            };
        }

        document.addEventListener("keydown", direction);

        function direction(event) {
            let key = event.keyCode;
            if( key == 37 && d != "RIGHT") d = "LEFT";
            else if(key == 38 && d != "DOWN") d = "UP";
            else if(key == 39 && d != "LEFT") d = "RIGHT";
            else if(key == 40 && d != "UP") d = "DOWN";
        }

        function drawGame() {
            // רקע
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // אוכל
            ctx.fillStyle = "#ff0044";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#ff0044";
            ctx.fillRect(food.x, food.y, box, box);
            ctx.shadowBlur = 0;

            // נחש
            for( let i = 0; i < snake.length; i++){
                ctx.fillStyle = ( i == 0 ) ? "#00ff88" : "#00cc6a";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
                ctx.strokeStyle = "#000";
                ctx.strokeRect(snake[i].x, snake[i].y, box, box);
            }

            // מיקום ראש ישן
            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if( d == "LEFT") snakeX -= box;
            if( d == "UP") snakeY -= box;
            if( d == "RIGHT") snakeX += box;
            if( d == "DOWN") snakeY += box;

            // בדיקת אכילה
            if(snakeX == food.x && snakeY == food.y){
                score++;
                document.getElementById('score').innerText = score;
                generateFood();
            } else {
                // מחיקת הזנב רק אם לא אכלנו
                if(d) snake.pop(); 
            }

            let newHead = { x : snakeX, y : snakeY };

            // בדיקת פסילה
            if(d && (snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake))){
                clearInterval(gameInterval);
                alert('GAME OVER! Score: ' + score);
            }

            if(d) snake.unshift(newHead);
        }

        function collision(head, array){
            for(let i = 0; i < array.length; i++){
                if(head.x == array[i].x && head.y == array[i].y){
                    return true;
                }
            }
            return false;
        }

    </script>
</body>
</html>
