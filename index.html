<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>SNAKE OS - ULTIMATE BLACK</title>
<link rel="icon" href="https://img.icons8.com/emoji/48/snake-emoji.png">
<style>
body, html {
    margin:0; padding:0; height:100%;
    background:#000; color:#e0e0e0;
    font-family:'Segoe UI', sans-serif;
    display:flex; flex-direction:column;
    overflow:hidden;
}
* { box-sizing:border-box; }

.admin-header {
    background:#050505; height:40px;
    display:flex; align-items:center;
    justify-content:space-between;
    padding:0 15px;
    border-bottom:1px solid #333;
}
.brand { color:#fff; font-weight:bold; }
.clock-display {
    color:#0f0;
    font-family:monospace;
    position:absolute;
    left:50%;
    transform:translateX(-50%);
}

.nav-container { background:#080808; border-bottom:1px solid #222; }
.tabs-row {
    display:flex; align-items:flex-end;
    padding:0 10px; gap:5px; height:30px;
}
.tab {
    background:#1a1a1a; color:#666;
    padding:2px 15px;
    border-radius:8px 8px 0 0;
    font-size:12px;
    cursor:pointer;
    border:1px solid #222;
    border-bottom:none;
}
.tab.active {
    background:#000; color:#fff;
    border-top:2px solid #0f0;
}
.close-tab:hover { color:red; cursor:pointer; }
.add-tab-btn { font-size:20px; cursor:pointer; color:#444; }

.address-bar-row {
    display:flex; gap:10px;
    padding:5px 15px;
    background:#000;
}
.nav-btn {
    width:30px; height:30px;
    border-radius:50%;
    background:#111;
    border:1px solid #333;
    color:#aaa;
    cursor:pointer;
}
.nav-btn:hover { background:#333; color:#fff; }

.url-input {
    flex:1;
    background:#111;
    border:1px solid #333;
    border-radius:20px;
    padding:6px 15px;
    color:#0f0;
    font-family:monospace;
    direction:ltr;
}

#content-area { flex:1; position:relative; }
.page-content { display:none; width:100%; height:100%; }
.page-content.active { display:flex; }

.home-screen {
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}
.logo-container {
    width:150px; height:150px;
    background:url("https://img.icons8.com/ios-filled/100/ffffff/fingerprint.png") center/contain no-repeat;
    filter:drop-shadow(0 0 10px #0f0);
}
.big-search-box {
    width:500px;
    padding:15px;
    border-radius:30px;
    background:#111;
    border:1px solid #333;
    color:#fff;
    font-size:16px;
    text-align:center;
}

.iframe-wrapper { flex:1; position:relative; display:none; }
.iframe-wrapper iframe {
    width:100%; height:calc(100% + 100px);
    border:none;
    position:absolute;
    top:-100px;
    filter:invert(1) grayscale(1);
}

.fake-google-bar {
    position:absolute;
    top:0; left:0;
    width:100%; height:70px;
    background:#000;
    border-bottom:1px solid #222;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10;
}

.fake-search-input-wrapper {
    width:70%;
    background:#111;
    border:1px solid #333;
    border-radius:25px;
    padding:10px;
    display:flex;
    gap:10px;
}
.fake-input {
    flex:1;
    background:none;
    border:none;
    color:#ddd;
}

.game-mode-btn {
    background:#333;
    border:1px solid #444;
    border-radius:15px;
    padding:5px 12px;
    cursor:pointer;
}

.exit-game-btn {
    position:absolute;
    top:10px; right:20px;
    background:#000;
    color:#fff;
    border:1px solid #fff;
    border-radius:20px;
    padding:5px 15px;
    cursor:pointer;
    display:none;
    z-index:50;
}

.iframe-wrapper.game-mode iframe {
    top:0; height:100%; filter:none;
}
.iframe-wrapper.game-mode .fake-google-bar { display:none; }
.iframe-wrapper.game-mode .exit-game-btn { display:block; }
</style>
</head>

<body>

<div class="admin-header">
    <div class="brand">SNAKE OS</div>
    <div class="clock-display" id="real-time-clock"></div>
    <div></div>
</div>

<div class="nav-container">
    <div class="tabs-row">
        <div id="tabs-list" style="display:flex; gap:5px;"></div>
        <div class="add-tab-btn" onclick="openNewTab()">+</div>
    </div>
    <div class="address-bar-row">
        <button class="nav-btn" onclick="goBack()">➜</button>
        <button class="nav-btn" style="transform:scaleX(-1)" onclick="goForward()">➜</button>
        <button class="nav-btn" onclick="doRefresh()">↻</button>
        <input id="url-bar" class="url-input" placeholder="חיפוש..."
        onkeypress="if(event.key==='Enter') performSearch(this.value)">
    </div>
</div>

<div id="content-area"></div>

<script>
function updateClock(){
    document.getElementById("real-time-clock").innerText =
    new Date().toLocaleTimeString("he-IL");
}
setInterval(updateClock,1000); updateClock();

let tabCounter=0, activeTabId=null;
let historyStack={}, historyIndex={};

function openNewTab(){
    tabCounter++;
    const tabId="tab-"+tabCounter;
    const contentId="content-"+tabCounter;

    historyStack[tabId]=["home"];
    historyIndex[tabId]=0;

    const tab=document.createElement("div");
    tab.className="tab";
    tab.id=tabId;
    tab.innerHTML=`<span>New Tab</span> <span class="close-tab" onclick="closeTab(event,'${tabId}')">×</span>`;
    tab.onclick=()=>switchToTab(tabId);
    document.getElementById("tabs-list").appendChild(tab);

    const content=document.createElement("div");
    content.className="page-content";
    content.id=contentId;
    content.innerHTML=`
    <div class="home-screen">
        <div class="logo-container"></div>
        <input class="big-search-box" placeholder="Search..."
        onkeypress="if(event.key==='Enter') performSearch(this.value)">
    </div>

    <div class="iframe-wrapper">
        <div class="exit-game-btn" onclick="toggleGameMode('${contentId}',false)">EXIT</div>
        <div class="fake-google-bar">
            <div class="fake-search-input-wrapper">
                <input class="fake-input" placeholder="Search..."
                onkeypress="if(event.key==='Enter') performSearch(this.value)">
                <div class="game-mode-btn" onclick="toggleGameMode('${contentId}',true)">GAME</div>
            </div>
        </div>
        <iframe src="about:blank"></iframe>
    </div>`;
    document.getElementById("content-area").appendChild(content);
    switchToTab(tabId);
}

function performSearch(query){
    if(!activeTabId || !query) return;

    const stack=historyStack[activeTabId];
    historyStack[activeTabId]=stack.slice(0,historyIndex[activeTabId]+1);
    historyStack[activeTabId].push(query);
    historyIndex[activeTabId]++;

    loadContent(activeTabId,query);

    /* 🔥 ניקוי כל שדות החיפוש */
    document.getElementById("url-bar").value="";
    document.querySelectorAll(".big-search-box,.fake-input")
    .forEach(i=>i.value="");
}

function loadContent(tabId,query){
    const content=document.getElementById(tabId.replace("tab-","content-"));
    const home=content.querySelector(".home-screen");
    const wrapper=content.querySelector(".iframe-wrapper");
    const iframe=wrapper.querySelector("iframe");

    if(query==="home"){
        home.style.display="flex";
        wrapper.style.display="none";
        return;
    }

    home.style.display="none";
    wrapper.style.display="block";
    wrapper.classList.remove("game-mode");

    let url = (query.includes(".") && !query.includes(" "))
        ? (query.startsWith("http")?query:"https://"+query)
        : "https://www.google.com/search?q="+encodeURIComponent(query);

    iframe.src=url;
}

function toggleGameMode(id,on){
    const w=document.getElementById(id).querySelector(".iframe-wrapper");
    on?w.classList.add("game-mode"):w.classList.remove("game-mode");
}

function switchToTab(id){
    activeTabId=id;
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    document.querySelectorAll(".page-content").forEach(c=>c.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    document.getElementById(id.replace("tab-","content-")).classList.add("active");
}

function closeTab(e,id){
    e.stopPropagation();
    if(document.querySelectorAll(".tab").length===1) return;
    document.getElementById(id.replace("tab-","content-")).remove();
    document.getElementById(id).remove();
    delete historyStack[id]; delete historyIndex[id];
}

function goBack(){
    if(historyIndex[activeTabId]>0){
        historyIndex[activeTabId]--;
        loadContent(activeTabId,historyStack[activeTabId][historyIndex[activeTabId]]);
    }
}
function goForward(){
    if(historyIndex[activeTabId]<historyStack[activeTabId].length-1){
        historyIndex[activeTabId]++;
        loadContent(activeTabId,historyStack[activeTabId][historyIndex[activeTabId]]);
    }
}
function doRefresh(){
    const iframe=document.getElementById(activeTabId.replace("tab-","content-"))
    .querySelector("iframe");
    iframe.src=iframe.src;
}

openNewTab();
</script>
</body>
</html>
