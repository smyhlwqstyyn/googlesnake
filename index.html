<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>SNAKE OS - v11.3 GAMING</title>
    <link rel="icon" href="https://img.icons8.com/emoji/48/snake-emoji.png">
    <style>
        /* --- עיצוב בסיסי --- */
        body, html { margin: 0; padding: 0; height: 100%; background: #111; font-family: 'Segoe UI', sans-serif; overflow: hidden; color: white; display: flex; flex-direction: column; background-size: cover; background-position: center; }
        * { box-sizing: border-box; outline: none; }

        /* --- הבר העליון --- */
        .admin-header {
            background: rgba(0, 0, 0, 0.95);
            border-bottom: 2px solid #0f0;
            height: 50px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            justify-content: space-between;
            z-index: 200;
        }
        .brand { color: #0f0; font-weight: bold; font-size: 18px; display: flex; align-items: center; gap: 10px; }
        
        /* --- עיצוב השעון החדש --- */
        .clock-display {
            font-family: 'Courier New', monospace;
            font-size: 20px;
            font-weight: bold;
            color: #0f0;
            background: #000;
            padding: 5px 15px;
            border: 1px solid #0f0;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
            letter-spacing: 2px;
        }

        .user-area { display: flex; align-items: center; gap: 15px; }
        .icon-btn { cursor: pointer; font-size: 22px; color: #aaa; transition: 0.3s; }
        .icon-btn:hover { color: #0f0; }
        .user-profile-btn { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 5px 10px; border-radius: 20px; transition: 0.2s; }
        .user-profile-btn:hover { background: rgba(255,255,255,0.1); }
        .user-avatar { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #0f0; background-size: cover; background-position: center; }
        .user-info-text { font-size: 12px; text-align: right; }
        .user-name { font-weight: bold; }

        /* תפריטים */
        .dropdown-menu { position: absolute; top: 55px; left: 15px; background: #222; border: 1px solid #444; border-radius: 8px; width: 280px; padding: 15px; display: none; flex-direction: column; gap:8px; z-index:300; }
        .dropdown-menu.show { display: flex; }
        .input-group label { font-size: 12px; color: #ccc; display: block; margin-bottom: 3px; }
        .input-group input { width: 100%; background: #111; border: 1px solid #555; color: white; padding: 8px; border-radius: 5px; }
        .save-btn { background: #0f0; color: black; border: none; padding: 8px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 5px; }

        /* --- ניווט --- */
        .nav-container { background: #222; border-bottom: 1px solid #333; display: flex; flex-direction: column; padding-top: 5px; }
        .tabs-row { display: flex; align-items: flex-end; padding: 0 10px; gap: 5px; height: 35px; }
        .tab { background: #333; color: #aaa; padding: 5px 15px; border-radius: 10px 10px 0 0; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px; max-width: 200px; }
        .tab.active { background: #000; color: #0f0; height: 35px; border-top: 2px solid #0f0; }
        .close-tab { font-size: 16px; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
        .close-tab:hover { background: #f00; color: white; }
        .add-tab-btn { color: #0f0; font-size: 24px; cursor: pointer; padding: 0 10px; font-weight: bold; }

        .address-bar-row { padding: 8px 15px; display: flex; gap: 10px; align-items: center; background: #1a1a1a; }
        .nav-btn { background: transparent; border: 1px solid transparent; color: #ddd; font-size: 18px; cursor: pointer; padding: 5px 10px; border-radius: 5px; }
        .nav-btn:hover { background: #444; }
        .url-input { flex-grow: 1; background: #111; border: 1px solid #444; color: #0f0; padding: 8px 15px; border-radius: 20px; font-size: 14px; direction: ltr; text-align: left; font-family: monospace; }

        /* --- תוכן --- */
        #content-area { flex-grow: 1; position: relative; overflow: hidden; }
        .page-content { width: 100%; height: 100%; display: none; flex-direction: column; position: relative; }
        .page-content.active { display: flex; }

        .home-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: white; background: rgba(0,0,0,0.6); }
        .big-search-box { width: 500px; padding: 15px; border-radius: 30px; background: #222; border: 2px solid #34A853; color: white; font-size: 18px; margin-top: 20px; text-align: center; }

        /* --- עיצוב האייפריים והמסכה/הלוח המותאם --- */
        .iframe-wrapper {
            flex-grow: 1;
            position: relative;
            overflow: hidden; 
            background: #fff; 
            display: none;
        }

        /* 1. מצב רגיל */
        .iframe-wrapper iframe {
            width: 100%;
            height: calc(100% + 130px);
            border: none;
            position: absolute;
            top: -130px; 
            left: 0;
            transition: top 0.3s, height 0.3s;
        }

        .fake-google-bar {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 80px;
            background: linear-gradient(135deg, rgba(255,255,255,0.96), rgba(245,245,245,0.98));
            color: #222;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            z-index: 10;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 18px rgba(0,0,0,0.12);
            transition: top 0.3s, transform 0.2s;
            padding: 10px 20px;
        }

        .fake-google-bar .site-brand {
            position: absolute;
            right: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .site-logo {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            overflow: hidden;
            flex: 0 0 44px;
            display: inline-block;
            border: 1px solid rgba(0,0,0,0.06);
            background: #fff;
        }
        .site-logo img { width: 100%; height: 100%; object-fit: cover; display:block; }

        .fake-search-input-wrapper {
            max-width: 820px;
            width: calc(100% - 220px);
            height: 48px;
            background: linear-gradient(180deg, #ffffff, #fbfbfb);
            border: 1px solid #e6e6e6;
            border-radius: 28px;
            display: flex; align-items: center; padding: 0 14px; box-shadow: 0 2px 8px rgba(20,20,20,0.06);
            gap: 10px;
        }
        .fake-search-input-wrapper:hover { box-shadow: 0 6px 18px rgba(20,20,20,0.08); }
        .fake-input { flex-grow: 1; border: none; outline: none; font-size: 16px; color: #202124; margin: 0 10px; background: transparent; direction: ltr; text-align: left; }
        .search-icon { font-size: 18px; color: #9aa0a6; }
        
        .controls-wrapper {
            display: flex; gap: 10px;
            align-items: center;
        }

        .ai-mode-badge {
            display: flex; align-items: center; background: #f1f3f4; color: #1f1f1f; padding: 6px 12px;
            border-radius: 18px; font-size: 13px; font-weight: 500; cursor: pointer; gap: 8px;
        }
        .ai-mode-badge:hover { background: #e8eaed; transform: translateY(-1px); }

        .game-mode-btn {
            display: flex; align-items: center; background: #34A853; color: white; padding: 6px 14px;
            border-radius: 18px; font-size: 13px; font-weight: bold; cursor: pointer; gap: 8px;
            animation: pulse 2.4s infinite;
        }
        .game-mode-btn:hover { background: #2d8e47; transform: translateY(-1px); }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(52, 168, 83, 0.7); } 70% { box-shadow: 0 0 0 12px rgba(52, 168, 83, 0); } 100% { box-shadow: 0 0 0 0 rgba(52, 168, 83, 0); } }

        .exit-game-btn {
            position: absolute; top: 10px; right: 20px; z-index: 100;
            background: rgba(0,0,0,0.8); color: #0f0; padding: 5px 15px; border-radius: 20px;
            cursor: pointer; display: none; border: 1px solid #0f0; font-weight: bold;
        }
        .iframe-wrapper.game-mode .exit-game-btn { display: block; }

        /* 2. מצב משחק */
        .iframe-wrapper.game-mode iframe {
            top: 0 !important;
            height: 100% !important;
        }
        .iframe-wrapper.game-mode .fake-google-bar {
            top: -100px;
            transform: translateY(-6px);
        }

        @media (max-width: 900px) {
            .fake-search-input-wrapper { width: calc(100% - 160px); max-width: 520px; }
            .site-logo { width:36px; height:36px; }
        }

    </style>
</head>
<body>

    <!-- חלק עליון -->
    <div class="admin-header">
        <div class="brand"><span>🐍</span> SNAKE OS PRO</div>
        
        <!-- השעון שהוספתי כאן -->
        <div class="clock-display" id="real-time-clock">00:00:00</div>

        <div class="user-area">
            <div class="icon-btn" onclick="toggleMenu('bg-menu')">⚙️</div>
            <div class="user-profile-btn" onclick="toggleMenu('profile-menu')">
                <div class="user-info-text">
                    <div class="user-name" id="display-name">אורח</div>
                    <div class="user-email" id="display-email">פרופיל</div>
                </div>
                <div class="user-avatar" id="display-avatar"></div>
            </div>
        </div>

        <div class="dropdown-menu" id="profile-menu">
            <div class="menu-title">פרופיל</div>
            <div class="input-group"><label>שם:</label><input type="text" id="edit-name"></div>
            <div class="input-group"><label>אימייל:</label><input type="text" id="edit-email"></div>
            <div class="input-group"><label>תמונה:</label><input type="text" id="edit-avatar"></div>
            <button class="save-btn" onclick="saveProfile()">שמור</button>
        </div>
        <div class="dropdown-menu" id="bg-menu" style="right: 60px; left: auto;">
            <div class="menu-title">רקע</div>
            <div class="input-group"><label>תמונה:</label><input type="text" id="bg-input"></div>
            <button class="save-btn" onclick="changeBackground()">החל</button>
        </div>
    </div>

    <!-- ניווט -->
    <div class="nav-container">
        <div class="tabs-row">
            <div id="tabs-list" style="display:flex; gap:5px; align-items:flex-end;"></div>
            <div class="add-tab-btn" onclick="openNewTab()">+</div>
        </div>
        <div class="address-bar-row">
            <button class="nav-btn" onclick="window.history.back()">➜</button>
            <button class="nav-btn" style="transform: scaleX(-1);" onclick="window.history.forward()">➜</button>
            <button class="nav-btn" onclick="doRefresh()">↻</button>
            <input type="text" class="url-input" id="url-bar" placeholder="חיפוש או כתובת..." onkeypress="if(event.key==='Enter') performSearch(this.value)">
        </div>
    </div>

    <!-- תוכן ראשי -->
    <div id="content-area"></div>

    <script>
        // --- קוד לשעון ---
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('he-IL'); // פורמט שעות ישראלי
            document.getElementById('real-time-clock').innerText = timeString;
        }
        setInterval(updateClock, 1000);
        updateClock(); // הפעלה ראשונית

        // --- המשך הקוד המקורי ---
        let tabCounter = 0;
        let activeTabId = null;
        history.pushState({page: 'home'}, 'Home', '#home');

        function openNewTab() {
            tabCounter++;
            const tabId = 'tab-' + tabCounter;
            const contentId = 'content-' + tabCounter;

            const tabsList = document.getElementById('tabs-list');
            const newTab = document.createElement('div');
            newTab.className = 'tab';
            newTab.id = tabId;
            newTab.onclick = () => switchToTab(tabId);
            newTab.innerHTML = `<span>דף הבית</span> <span class="close-tab" onclick="closeTab(event, '${tabId}')">×</span>`;
            tabsList.appendChild(newTab);

            const contentArea = document.getElementById('content-area');
            const newContent = document.createElement('div');
            newContent.className = 'page-content';
            newContent.id = contentId;
            
            newContent.innerHTML = `
                <div class="home-screen">
                    <div style="font-size:80px; margin-bottom:15px;">🐍</div>
                    <h1 style="color:#0f0;">SNAKE SEARCH</h1>
                    <input type="text" class="big-search-box" placeholder="מה נחפש היום?" onkeypress="if(event.key==='Enter') performSearch(this.value)">
                </div>
                
                <div class="iframe-wrapper">
                    <!-- כפתור יציאה ממצב משחק -->
                    <div class="exit-game-btn" onclick="toggleGameMode('${contentId}', false)">
                        ✖ יציאה ממצב משחק
                    </div>

                    <!-- הלוח המותאם -->
                    <div class="fake-google-bar">
                        <div class="site-brand">
                            <div class="site-logo">
                                <img src="https://via.placeholder.com/80x80.png?text=LOGO" alt="site logo">
                            </div>
                        </div>

                        <div class="fake-search-input-wrapper">
                            <span class="search-icon">🔎</span>
                            <input type="text" class="fake-input" onkeypress="if(event.key==='Enter') performSearch(this.value)" placeholder="חפש באתר או הקלד כתובת...">
                            <div class="controls-wrapper" style="margin-left:8px;">
                                <div class="ai-mode-badge">✨ AI Mode</div>
                                <div class="game-mode-btn" onclick="toggleGameMode('${contentId}', true)">
                                    🎮 מצב משחק
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <iframe src="about:blank" sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-modals allow-pointer-lock"></iframe>
                </div>
            `;
            contentArea.appendChild(newContent);
            switchToTab(tabId);
        }

        function toggleGameMode(contentId, enable) {
            const wrapper = document.getElementById(contentId).querySelector('.iframe-wrapper');
            if (enable) {
                wrapper.classList.add('game-mode');
            } else {
                wrapper.classList.remove('game-mode');
            }
        }

        function performSearch(query) {
            if(!activeTabId || !query) return;
            history.pushState({page: 'search', query: query, tabId: activeTabId}, query, '#search');
            loadContent(activeTabId, query);
        }

        function loadContent(tabId, query) {
            const contentId = tabId.replace('tab-', 'content-');
            const contentDiv = document.getElementById(contentId);
            const home = contentDiv.querySelector('.home-screen');
            const wrapper = contentDiv.querySelector('.iframe-wrapper');
            const iframe = wrapper.querySelector('iframe');
            const fakeInput = wrapper.querySelector('.fake-input');

            wrapper.classList.remove('game-mode');

            home.style.display = 'none';
            wrapper.style.display = 'block';

            let url = "";
            if (query.indexOf('.') > -1 && query.indexOf(' ') === -1) {
                url = query.startsWith('http') ? query : 'https://' + query;
                wrapper.classList.add('game-mode'); 
            } else {
                url = "https://www.google.com/search?igu=1&pws=0&gl=il&hl=he&q=" + encodeURIComponent(query);
            }

            if(iframe.src !== url) iframe.src = url;

            const tabTitle = document.querySelector(`#${tabId} span`);
            tabTitle.innerText = query.length > 15 ? query.substring(0, 15) + '...' : query;
            if(activeTabId === tabId) document.getElementById('url-bar').value = query;
            if(fakeInput) fakeInput.value = query;
        }

        window.onpopstate = function(event) {
            if (!event.state) return;
            if (event.state.page === 'home' && activeTabId) {
                const contentDiv = document.getElementById(activeTabId.replace('tab-', 'content-'));
                contentDiv.querySelector('.home-screen').style.display = 'flex';
                contentDiv.querySelector('.iframe-wrapper').style.display = 'none';
                document.getElementById('url-bar').value = '';
                document.querySelector(`#${activeTabId} span`).innerText = 'דף הבית';
            } else if (event.state.page === 'search') {
                document.getElementById('url-bar').value = event.state.query;
            }
        };

        function switchToTab(tabId) {
            activeTabId = tabId;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.page-content').forEach(c => c.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            const contentId = tabId.replace('tab-', 'content-');
            document.getElementById(contentId).classList.add('active');
            
            const isHome = document.getElementById(contentId).querySelector('.home-screen').style.display !== 'none';
            if(isHome) document.getElementById('url-bar').value = '';
            else document.getElementById('url-bar').value = document.querySelector(`#${tabId} span`).innerText;
        }

        function closeTab(e, tabId) {
            e.stopPropagation();
            if (document.querySelectorAll('.tab').length === 1) { alert("חייב טאב אחד!"); return; }
            const tab = document.getElementById(tabId);
            if (tab.classList.contains('active')) {
                const sibling = tab.previousElementSibling || tab.nextElementSibling;
                if(sibling && sibling.id !== 'tabs-list') sibling.click();
                else document.querySelector('.tab:not(#'+tabId+')').click();
            }
            tab.remove();
            document.getElementById(tabId.replace('tab-', 'content-')).remove();
        }

        function doRefresh() {
            if(activeTabId) {
                const iframe = document.getElementById(activeTabId.replace('tab-', 'content-')).querySelector('iframe');
                if(iframe.src !== 'about:blank') iframe.src = iframe.src;
            }
        }

        function saveProfile() {
            const name = document.getElementById('edit-name').value;
            const email = document.getElementById('edit-email').value;
            const avatar = document.getElementById('edit-avatar').value;
            if(name) { document.getElementById('display-name').innerText = name; localStorage.setItem('uName', name); }
            if(email) { document.getElementById('display-email').innerText = email; localStorage.setItem('uEmail', email); }
            if(avatar) { document.getElementById('display-avatar').style.backgroundImage = `url('${avatar}')`; localStorage.setItem('uAvatar', avatar); }
            toggleMenu('profile-menu');
        }
        function changeBackground() {
            const url = document.getElementById('bg-input').value;
            if(url) { document.body.style.backgroundImage = `url('${url}')`; localStorage.setItem('uBg', url); }
            toggleMenu('bg-menu');
        }
        function toggleMenu(id) {
            const el = document.getElementById(id);
            const show = el.classList.contains('show');
            document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
            if(!show) el.classList.add('show');
        }
        
        const uName = localStorage.getItem('uName');
        const uEmail = localStorage.getItem('uEmail');
        const uAvatar = localStorage.getItem('uAvatar');
        const uBg = localStorage.getItem('uBg');
        if(uName) document.getElementById('display-name').innerText = uName;
        if(uEmail) document.getElementById('display-email').innerText = uEmail;
        if(uAvatar) document.getElementById('display-avatar').style.backgroundImage = `url('${uAvatar}')`;
        if(uBg) document.body.style.backgroundImage = `url('${uBg}')`;

        window.onclick = e => {
            if(!e.target.closest('.user-area') && !e.target.closest('.dropdown-menu')) 
                document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
        };

        openNewTab();
    </script>
</body>
</html>
